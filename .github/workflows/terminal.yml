name: terminal

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's fastest)
  workflow_dispatch:         # "Run workflow" button for a manual run

concurrency:
  group: terminal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Load state
        run: |
          mkdir -p state
          if git fetch -q origin state 2>/dev/null; then
            git show FETCH_HEAD:state.enc > state/state.enc || rm -f state/state.enc
          fi

      - name: Run terminal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROFILE: ${{ secrets.PROFILE }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: python terminal.py

      - name: Save state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f state/state.enc ] || exit 0
          cd state
          git init -q -b state
          git add state.enc
          git -c user.name=terminal -c user.email=terminal@users.noreply.github.com commit -qm state
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
